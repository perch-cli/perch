name: Release

# The tag release-plz pushed when its release pull request was merged. Nothing
# else starts this: no manual dispatch, no branch push. A release is a tag, and
# a tag is a thing release-plz made from a version somebody reviewed.
on:
  push:
    tags: ["v*"]

# Read by default. The one job that writes says so for itself, so a compromised
# build step cannot reach the Release page.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Homebrew hardcodes the name: `brew tap perch-cli/perch` looks here.
  TAP: perch-cli/homebrew-perch

jobs:
  # Three things have to be true before anything is built, and each of them is
  # cheap to check and expensive to discover afterwards.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Tap is the last thing a Release writes, so this is the one credential
      # whose failure lands after the Release page is public.
      - name: The tap token still reaches the tap
        uses: ./.github/actions/token-still-reaches
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: ${{ env.TAP }}
          secret: HOMEBREW_TAP_TOKEN

      # A tag that disagrees with the manifest ships a binary reporting a
      # version nobody released, and it is invisible until somebody files a bug
      # against a version that does not exist.
      - name: Tag matches the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest"
            exit 1
          fi
          echo "both say $manifest"

      # A Release builds rather than tests, so it waits for the CI run on this
      # commit rather than assuming it finished (ADR this-repo-assembles-a-release).
      # `success` is the aggregate job branch protection already asks about.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            verdict=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
              --jq '.check_runs[] | select(.name == "success") | "\(.status) \(.conclusion)"' | head -n1)

            case "$verdict" in
              "completed success")
                echo "CI passed on $GITHUB_SHA"
                exit 0
                ;;
              "completed "*)
                echo "::error::CI on $GITHUB_SHA concluded: ${verdict#completed }"
                exit 1
                ;;
              "")
                echo "no CI run on $GITHUB_SHA yet; waiting"
                ;;
              *)
                echo "CI on $GITHUB_SHA is ${verdict% *}; waiting"
                ;;
            esac

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::gave up waiting for CI on $GITHUB_SHA"
              exit 1
            fi
            sleep 20
          done

  # One target per runner of its own architecture. The only cross-compile is
  # x86_64 macOS from an arm64 runner, which Apple's toolchain does without
  # being asked twice; everything else builds where it will run.
  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache here, deliberately. Caching saves minutes on a job that
      # runs once per release, and it does it by reusing artifacts from an
      # earlier run in the binary people are about to install.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      # musl's C toolchain, for the linker driver. Perch's dependencies are
      # pure Rust, so this is belt and braces rather than a requirement — and
      # it is the cheap half of the pair.
      - name: musl
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Flat archives — the binary and both licenses, no wrapping directory —
      # because everything that reads them extracts into a directory of its own.
      # `.zip` on Windows, where tar in the shell is not a given.
      - name: Archive
        if: runner.os != 'Windows'
        run: |
          staging="perch-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist "$staging"
          cp "target/${{ matrix.target }}/release/perch" LICENSE-MIT LICENSE-APACHE "$staging/"
          # Short flags and named members: GNU tar on the Linux runners and
          # bsdtar on the macOS ones agree on these and not on much else.
          tar -czf "dist/$staging.tar.gz" -C "$staging" perch LICENSE-MIT LICENSE-APACHE
          ls -l dist

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "perch-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist, $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/perch.exe", LICENSE-MIT, LICENSE-APACHE $staging
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$staging.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Everything a release consists of, assembled in one place and published in
  # one act. The Release is created as a draft and only made visible once the
  # binaries, the checksums and the attestations are all on it — there is never
  # a moment when the page exists and the files do not.
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # What signs the provenance. Sigstore's certificate is issued against this
      # workflow's OIDC identity, which is what lets `gh attestation verify` say
      # which workflow at which commit built the binary somebody is holding.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      # One file for the whole release rather than a sidecar per asset: an
      # installer fetches it once and greps, and a person verifies everything
      # they downloaded in a single command.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum perch-* > SHA256SUMS
          cat SHA256SUMS

      # Sigstore issues the signing certificate and can refuse with a 403 that a
      # second request does not get. Retried here rather than by re-running the
      # tag: the archives exist by this point and the Release page does not, so
      # seconds of Sigstore being unreachable otherwise cost the whole job. A
      # second attestation over the same archives is redundant, never wrong.
      - name: Attest
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/perch-*

      - name: Wait for Sigstore
        if: steps.attest.outcome == 'failure'
        run: sleep 30

      # `attest_again` rather than `attest-again`: a hyphen inside a step id is
      # subtraction to the expression parser, and `steps.attest-again` is empty.
      - name: Attest, second attempt
        id: attest_again
        if: steps.attest.outcome == 'failure'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/perch-*

      - name: Wait for Sigstore, longer
        if: steps.attest_again.outcome == 'failure'
        run: sleep 90

      # The last one, so no `continue-on-error`: an unattested archive is not a
      # Release this repository publishes.
      - name: Attest, last attempt
        if: steps.attest_again.outcome == 'failure'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/perch-*

      # The notes release-plz wrote into CHANGELOG.md are the ones that were
      # reviewed. Falling back to GitHub's generated list rather than failing:
      # neither an empty body nor a machine-written one is worth stopping a
      # Release over.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v " ")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true

          # A Release body stops at 125000 characters and a CHANGELOG.md section
          # does not. Cut at a line boundary and pointed at the file, rather than
          # dropped for the generated commit list.
          if [ "$(wc -c < notes.md)" -gt 124000 ]; then
            head -c 124000 notes.md | head -n -1 > kept.md
            {
              cat kept.md
              printf '\n_Cut to fit a Release page. The whole entry is in [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md)._\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            } > notes.md
            echo "::warning::release notes cut to fit the 125000-character body"
          fi

          if [ -s notes.md ]; then
            cat notes.md
          else
            echo "::warning::no CHANGELOG.md section for $version; GitHub will generate the notes instead"
          fi

      # Not marked as a prerelease, even during 0.x: it genuinely is the latest
      # Release, and marking it otherwise would empty the `releases/latest`
      # endpoint the installers ask.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}" \
            dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # The six npm packages, from the same archives the Release page is holding —
  # not a fresh build — so what npm serves and what a browser downloads are the
  # same bytes. See docs/releasing.md for the one-time setup this needs.
  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A pause, not an approval. The reviewer is whoever tagged, self-review is
    # permitted and an admin can bypass, so what this stops is a tag pushed in
    # the wrong minute reaching a public registry unlooked-at, not an attacker.
    # Restricted to `v*` tags (ADR a-gate-lives-outside-the-tree).
    environment: release
    permissions:
      contents: read
      # npm's trusted publishing runs on this. There is no npm token anywhere in
      # this repository — the registry checks the workflow's own OIDC identity
      # instead, so there is nothing here for anyone to steal.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships something
      # later, but the runner's bundled npm is not a promise anyone made.
      - name: npm can publish without a token
        run: |
          have=$(npm --version)
          want=11.5.1
          if [ "$(printf '%s\n%s\n' "$want" "$have" | sort --version-sort | head -n1)" != "$want" ]; then
            echo "::error::npm $have cannot use trusted publishing; $want or newer is needed"
            exit 1
          fi
          echo "npm $have"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Unpack the released archives
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin \
                        aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            mkdir -p "bins/$target"
            tar -xzf "dist/perch-${GITHUB_REF_NAME}-${target}.tar.gz" -C "bins/$target" perch
          done

          mkdir -p bins/x86_64-pc-windows-msvc
          unzip -j "dist/perch-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" \
            perch.exe -d bins/x86_64-pc-windows-msvc

      - name: Assemble the packages
        run: node packaging/npm/build.mjs "${GITHUB_REF_NAME#v}" bins npm-dist

      # Platform packages first: the wrapper depends on each by exact version, so
      # publishing it first leaves a window where installing it resolves to
      # nothing that can run. To `latest`, the default tag, during 0.x as well.
      # Every path is written `./…` — a bare one is GitHub shorthand to npm.
      - name: Publish
        run: |
          for package in ./npm-dist/@perch-cli-*; do
            npm publish "$package" --access public --provenance
          done
          npm publish ./npm-dist/perch-cli --access public --provenance

      # What the previous step promised, read back: `npm publish` succeeding and
      # `latest` pointing at it are two claims, and the second is the one anybody
      # installs. Polled, because the write and the read do not reach the same
      # place, and `--prefer-online` so the loop does not re-ask its own cache.
      - name: latest points at this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          deadline=$(( $(date +%s) + 5 * 60 ))

          while :; do
            latest=$(npm view --prefer-online perch-cli@latest version 2>/dev/null || echo "")

            if [ "$latest" = "$version" ]; then
              echo "latest points at $version"
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::published $version, but perch-cli@latest still points at ${latest:-nothing} five minutes later"
              exit 1
            fi

            echo "latest is ${latest:-nothing}; the registry has not caught up yet"
            sleep 15
          done

  # Regenerates the Tap's formula and pushes it. Not behind the `release`
  # environment that gates npm: the formula can only point at assets whose
  # checksums this Release published, so the blast radius is a formula file.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checksums the release published, rather than a recomputation, so
      # the formula can only ever point at bytes that are on the Release page.
      - name: The published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir .

      - name: Formula
        run: |
          packaging/homebrew/formula.sh "${GITHUB_REF_NAME#v}" SHA256SUMS > perch.rb
          cat perch.rb

      # GITHUB_TOKEN cannot reach the Tap, so this is the one place a stored
      # credential is unavoidable: HOMEBREW_TAP_TOKEN is a fine-grained PAT with
      # Contents: read and write on perch-cli/homebrew-perch and nothing else.
      # Cloned anonymously, and the token is given only to the push, so it never
      # lands in .git/config on the runner.
      - name: Push to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://github.com/$TAP.git" tap
          mkdir -p tap/Formula
          cp perch.rb tap/Formula/perch.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/perch.rb

          # A re-run of a release that already pushed its formula should be a
          # no-op rather than an empty commit or a failure.
          if git diff --cached --quiet; then
            echo "the tap already has this formula"
            exit 0
          fi

          git commit -m "perch ${GITHUB_REF_NAME#v}"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/$TAP.git" HEAD:main

  # The site, once the Release exists and everything it holds can be downloaded
  # (ADR one-thing-renders-the-site). Called rather than left to an event this
  # workflow cannot raise: a Release created with GITHUB_TOKEN starts none.
  # `pages.yml` needs no tag, so this is safe on a re-run.
  site:
    needs: release
    # A called workflow gets no more than the caller grants it.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
