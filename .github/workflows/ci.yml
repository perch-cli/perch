name: CI

on:
  push:
    branches: [main]
  # The default types, deliberately not `edited`: types belong to the workflow
  # rather than the job, so asking for it here rebuilds this matrix on every
  # edited description. The title check needs it and lives in `pr-title.yml`.
  pull_request:
  # Claude Code updates continuously while this repository may not change for a
  # week, so the weekly run is what turns "we would have noticed" into "we did"
  # (ADR an-assumption-is-probed).
  schedule:
    - cron: "0 6 * * 1"

# Least privilege for GITHUB_TOKEN. CI only ever reads the repo, so nothing
# here can push, tag, comment, or publish even if a step is compromised.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Every platform runs everything it can, because Perch claims full parity.
    # Windows is the one to watch: its credential store is the
    # least-established belief in the design, which is where a canary belongs.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Pinned to commit SHAs rather than tags: a tag is mutable and can be
      # repointed at new code by whoever owns the action. The trailing comment
      # is the tag the SHA stood for when it was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps GITHUB_TOKEN out of .git/config: Cargo runs build.rs from
          # every dependency, so a hostile crate would otherwise have a
          # credential sitting on disk to read.
          persist-credentials: false

      # No toolchain action: rust-toolchain.toml pins the channel and its
      # components, so the version lives in one place rather than two. rustup
      # on the runner installs it on first use.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # Perch writes American English — CLAUDE.md says why, typos.toml is the
      # rule. Three invocations rather than one, because `typos` skips any file
      # its own config could live in and both files it skips are tracked. One
      # platform: spelling is a property of the code, not of the runner.
      - name: Spelling
        if: runner.os == 'Linux'
        run: |
          cargo install typos-cli --locked --version 1.36.2
          typos
          typos - < Cargo.toml
          typos - < typos.toml

      # --all-features so the gated suite is linted too: held back from
      # `cargo test` by a feature, it would otherwise go unlinted.
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Everything the default feature set builds, so nothing is added here
      # when a suite is: what is held back is held back by `required-features`
      # rather than by absence from a list. --locked, because a resolver free to
      # update Cargo.lock is a run that tested a set nobody has committed.
      - name: Unit and behavior tests
        run: cargo test --locked

      # The binary somebody downloads, built with the feature set it ships
      # with. `cargo test` turns `fakes` on through the dev-dependency, so this
      # is the only thing that catches a stray reference to `FakeHost`.
      - name: The shipped binary carries no fake
        run: cargo build --locked --bin perch

      # A dependency nothing imports is compile time and audit surface for no
      # call site, and it is invisible: nothing else fails when the last use of
      # a crate goes (ADR a-crate-must-not-cost-a-seam).
      - name: Unused dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete

      # Advisories against the exact dependency set that is committed, which is
      # the same set `--locked` above tested.
      - name: Advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings

      # `rust-version` in Cargo.toml is a claim, and a claim nothing checks
      # stops being true the first time somebody reaches for a newer language
      # feature. Checked rather than tested: building is what it promises, and
      # --all-features is what keeps the gated suite and the fakes inside it.
      - name: Minimum supported Rust version
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.97 --profile minimal
          cargo +1.97 check --locked --all-targets --all-features

      # Gives the step below a real bundle, and an outage upstream degrades to
      # the "no Claude Code here" branch rather than turning a request red. Pin
      # the code that runs, float the product it installs: pinning the version
      # would freeze the drift this exists to detect. A checksum failure is
      # almost always an updated install.sh — diff it, then bump INSTALL_SHA.
      - name: Install Claude Code
        if: runner.os != 'Windows'
        env:
          INSTALL_SHA: cde4f1702d3b1695f92b73d26888364e17bca476e17f0fd676484c951d36c125
        run: |
          # An unreachable installer is an upstream outage, not a signal about
          # this pull request: degrade to the "no Claude Code" branch.
          if ! curl -fsSL https://claude.ai/install.sh -o /tmp/install.sh; then
            echo "::warning::installer unreachable; the tests below will assert the absent branch"
            exit 0
          fi

          # A checksum mismatch is not an outage. Warning instead would let CI
          # stay green with drift detection quietly switched off.
          echo "$INSTALL_SHA  /tmp/install.sh" | shasum -a 256 -c -

          bash /tmp/install.sh latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The same bargain in PowerShell: pin install.ps1 by Get-FileHash, fail
      # hard on a mismatch, degrade to the absent branch on an outage. When the
      # hash check fails, diff the script and bump INSTALL_SHA here too.
      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALL_SHA: cd17c6b555f761d60373659824bf805e1510538226e4c7028e19d7494937a333
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          try {
            Invoke-WebRequest -Uri "https://claude.ai/install.ps1" -OutFile $installer
          } catch {
            Write-Output "::warning::installer unreachable; the tests below will assert the absent branch"
            exit 0
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne $env:INSTALL_SHA.ToLower()) {
            Write-Error "install.ps1 hash $hash does not match the pinned $env:INSTALL_SHA"
            exit 1
          }

          & $installer latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".local\bin")

      # Held back because it needs state a developer owns and did not offer,
      # and a runner is the one machine that can be asked for that consent
      # (ADR a-suite-is-named-and-gated). A step of its own, so a failure reads
      # as upstream drift. --nocapture because a suite that skipped and a suite
      # that asserted must not look identical.
      - name: The tests that need your machine
        run: cargo test --locked --features your-machine --test your_machine -- --nocapture

  # The installers and the packages a Channel installs are the part of Perch that
  # is not Rust, so nothing else here would notice a mistake in them
  # (ADR this-repo-assembles-a-release). The tools are already on the runners.
  installers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `-s sh` rather than bash: install.sh is piped into whatever `sh` is on
      # the machine, which on Debian is dash, and bashisms would work here and
      # fail there.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck --shell=sh pages/public/install.sh
          shellcheck --shell=sh packaging/install-test.sh
          shellcheck --shell=sh packaging/homebrew/formula.sh
          shellcheck --shell=sh packaging/npm/build-test.sh

      # Runs the real install.sh against a fabricated Release and asserts on the
      # PATH advice. `gh` is kept off the PATH it builds, because the provenance
      # check is binding by design and would refuse a fabricated archive.
      - name: install.sh advises correctly
        if: runner.os == 'Linux'
        run: sh packaging/install-test.sh

      # Runs the real build.mjs against fabricated binaries and asserts on the six
      # packages it assembles — the only thing that runs it before a tag is
      # pushed. Linux only: the script is platform-blind, and the Windows target
      # is exercised by fabricating a file called perch.exe.
      - name: build.mjs assembles the packages
        if: runner.os == 'Linux'
        run: sh packaging/npm/build-test.sh

      - name: PowerShell parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path pages/public/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          Write-Output "install.ps1 parses cleanly"

  # Built on every pull request, for the same reason the installers are checked
  # on one, and what it proves is the *next* release's site rather than the one
  # being served (ADR one-thing-renders-the-site). What gives it teeth is what
  # Starlight refuses: a page with no `title`, and a relative link naming a page
  # that is not there. The rest of it is `tests/publication.rs`.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 for the reason release.yml is on it, and because Astro 7 wants
      # 22.12 or newer.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Which pnpm is `packageManager` in pages/package.json and corepack reads
      # it, so CI and the deploy agree without a third-party action.
      - name: pnpm
        run: corepack enable pnpm

      # --frozen-lockfile: the lockfile carries an integrity hash for the whole
      # tree, and this refuses to install anything else.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types, lint and formatting
        run: pnpm check

      - name: The site builds
        run: pnpm build

  # Which lines the suites reach, reported to Codecov and shown as the README's
  # badge. One platform, because coverage is a property of the code rather than
  # of the runner. A job of its own rather than a step in `check`, because
  # instrumented tests run slower and the matrix is what gates a pull request:
  # coverage informs, it does not gate.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not in rust-toolchain.toml's `components`, for the reason its comment
      # gives about `targets`: one CI job wants this and nobody building Perch
      # does, so listing it there costs every contributor the download.
      - name: Toolchain
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo install` rather than a tool-installer action, as cargo-machete
      # and cargo-audit arrive: one fewer third-party action to trust.
      - name: cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.8.7

      # The default feature set, deliberately: instrumenting the gated suite
      # would count its lines on a runner where it is compiled out, which is a
      # figure that moves with the runner rather than with the tests.
      - name: Coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      # Conditional because the token is a repository secret and a fork's pull
      # request is not given one, so an outside contribution would otherwise
      # fail. `secrets` is unreadable from an `if:`, so it is computed here.
      - name: Is there a token to upload with
        id: token
        run: echo "present=${{ secrets.CODECOV_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload to Codecov
        if: steps.token.outputs.present == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          # An upload that failed silently is a badge that goes stale without
          # saying so, which is worse than no badge.
          fail_ci_if_error: true

      # Said out loud rather than skipped quietly: a coverage job that ran, did
      # the work and uploaded nothing looks identical to one that worked.
      - name: No token, no upload
        if: steps.token.outputs.present != 'true'
        run: |
          echo "::warning::CODECOV_TOKEN is not set, so the report was measured but not uploaded. The README's coverage badge stays unknown until it is."

  # The name branch protection listens to, however the matrix above grows or
  # renames its legs. `if: always()` with an explicit verdict, because a plain
  # `needs:` job is skipped when a leg fails and a skipped required check
  # satisfies branch protection. It does not speak for `pr-title.yml`: a job
  # cannot aggregate across workflows, so that one is required in its own right.
  success:
    needs: [check, installers, site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check concluded: ${{ needs.check.result }}"
            exit 1
          fi
          if [ "${{ needs.installers.result }}" != "success" ]; then
            echo "installers concluded: ${{ needs.installers.result }}"
            exit 1
          fi
          if [ "${{ needs.site.result }}" != "success" ]; then
            echo "site concluded: ${{ needs.site.result }}"
            exit 1
          fi
