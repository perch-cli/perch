name: CI

on:
  push:
    branches: [main]
  # `edited` on top of the three types this fires on by default, for the `title`
  # job below. A title is the one thing a check here asks the author to change,
  # and without this the check does not run again when they change it: the
  # verdict stays red on the old title until an unrelated push happens to
  # refresh the event payload, so the only ways out were a junk commit or
  # closing and reopening the pull request.
  #
  # The cost is the matrix re-running when a description is edited too, since
  # types are the workflow's and not the job's. That is minutes of runner time
  # against a check that could not otherwise be satisfied by doing what it asks.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # The contract suite exists to find Claude Code drift before a user does, and
  # Claude Code updates continuously while this repository may not change for a
  # week. A weekly run is what turns "we would have noticed" into "we did".
  schedule:
    - cron: "0 6 * * 1"

# Least privilege for GITHUB_TOKEN. CI only ever reads the repo, so nothing
# here can push, tag, comment, or publish even if a step is compromised.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # This job was macOS-only while the keychain and the `security` binary
    # were the point. Perch now claims full parity, so every platform runs
    # everything it can: the keychain contract tests still assert only on
    # macOS (they are compiled out elsewhere), and the file-store and session
    # contract tests run everywhere. Windows is the one to watch — its
    # credential store is the least-established belief in the design, which
    # is exactly where a canary belongs.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable and can be
      # repointed at new code by whoever owns the action. The trailing comment is
      # the tag the SHA stood for when it was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps GITHUB_TOKEN out of .git/config. Cargo runs build.rs from every
          # dependency during the build, so a hostile crate would otherwise have
          # a credential sitting on disk to read.
          persist-credentials: false

      # No toolchain action: rust-toolchain.toml pins the channel and its
      # components, so the version lives in one place rather than two that can
      # drift apart. rustup on the runner installs it on first use.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features so the contract suite is linted too: it is held back from
      # `cargo test` by a feature, and without this it would go unlinted.
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Everything the default feature set builds — lib, bin, doc tests, and
      # every tests/*.rs Cargo finds. Nothing to add here when a suite is: the
      # contract tests are the only ones held back, and they are held back by
      # `required-features` in Cargo.toml rather than by being absent from a
      # list somebody has to remember to extend.
      #
      # --locked because a resolver that is free to update Cargo.lock is a CI
      # run that tested a dependency set no one has committed.
      - name: Unit and behaviour tests
        run: cargo test --locked

      # The binary somebody downloads, built with the feature set it ships with
      # — which is the one the fakes are held back from. `cargo test` turns
      # `fakes` on through the dev-dependency, so it is the only thing that
      # proves nothing outside a test reaches for `FakeHost` or `FakeScreen`:
      # a single stray reference fails here and nowhere else.
      - name: The shipped binary carries no fakes
        run: cargo build --locked --bin perch

      # A dependency that nothing imports is compile time and audit surface for
      # no call site, and it is invisible: nothing fails when the last use of a
      # crate is deleted. This is the check that would have caught ratatui and
      # crossterm sitting unused (ADR 0016).
      - name: Unused dependencies
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete

      # Advisories against the exact dependency set that is committed, which is
      # the same set `--locked` above tested.
      - name: Advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings

      # `rust-version` in Cargo.toml is a claim, and a claim nothing checks is a
      # claim that quietly stops being true the first time somebody uses a
      # newer language feature. Checked rather than tested: building is what the
      # promise is about.
      - name: Minimum supported Rust version
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.97 --profile minimal
          cargo +1.97 check --locked --all-targets

      # Gives the contract tests a real bundle to assert against. If the install
      # is unavailable they assert the "no Claude Code here" branch instead, so
      # an outage upstream does not turn every pull request red.
      #
      # The installer is pinned by checksum but the version deliberately is not:
      # ADR 0007 wants the contract tests run against whatever Claude Code is
      # current, so pinning the version would freeze the drift this job exists
      # to detect. Pin the code that runs, float the product it installs.
      #
      # When this step fails on a checksum, Anthropic has almost certainly just
      # updated install.sh. Diff it, satisfy yourself, then bump INSTALL_SHA.
      - name: Install Claude Code
        if: runner.os != 'Windows'
        env:
          INSTALL_SHA: cde4f1702d3b1695f92b73d26888364e17bca476e17f0fd676484c951d36c125
        run: |
          # An unreachable installer is an upstream outage, not a signal about
          # this pull request: degrade to the "no Claude Code" branch.
          if ! curl -fsSL https://claude.ai/install.sh -o /tmp/install.sh; then
            echo "::warning::installer unreachable; contract tests will assert the absent branch"
            exit 0
          fi

          # A checksum mismatch is not an outage. Fail hard rather than warn:
          # a warning here would let the install quietly stop happening, the
          # contract tests fall back to the absent branch, and CI stay green
          # with drift detection switched off.
          echo "$INSTALL_SHA  /tmp/install.sh" | shasum -a 256 -c -

          bash /tmp/install.sh latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The same bargain in PowerShell: pin install.ps1 by Get-FileHash, fail
      # hard on a mismatch, degrade to the absent branch on an outage. When the
      # hash check fails, diff the script and bump INSTALL_SHA here too.
      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALL_SHA: cd17c6b555f761d60373659824bf805e1510538226e4c7028e19d7494937a333
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          try {
            Invoke-WebRequest -Uri "https://claude.ai/install.ps1" -OutFile $installer
          } catch {
            Write-Output "::warning::installer unreachable; contract tests will assert the absent branch"
            exit 0
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          if ($hash -ne $env:INSTALL_SHA.ToLower()) {
            Write-Error "install.ps1 hash $hash does not match the pinned $env:INSTALL_SHA"
            exit 1
          }

          & $installer latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE ".local\bin")

      # Contract tests assert the probe's beliefs against the installed Claude
      # Code, the real filesystem, and — on macOS — the real keychain (ADR
      # 0007), so drift is found here rather than by a user being logged out by
      # a background auto-update. Kept as a step of its own so a failure here
      # reads as upstream drift rather than as a fault in the pull request.
      #
      # --nocapture so the "skipping:" lines are visible: a suite that skipped
      # itself and a suite that asserted look identical otherwise.
      - name: Contract tests
        run: cargo test --locked --features contract --test contract --test contract_credentials --test contract_sessions --test contract_links -- --nocapture

  # release-plz reads commit subjects to decide the next version, and this
  # repository squash-merges, so the pull request title *is* the commit it
  # reads. A title that says nothing about the change does not break anything
  # visibly — it silently produces the wrong version number, which is precisely
  # the failure the tool was adopted to prevent. Checked here so it fails
  # loudly instead, in the one place someone is already looking.
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conventional Commits
        # Through the environment rather than `${{ }}` inside the script. A
        # pull request title is text a stranger chooses, and interpolating it
        # into a shell would run whatever a `$(...)` in it said, with this
        # workflow's token.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "got: $TITLE"
          echo "::error::A pull request title is the commit message, and release-plz reads it to pick the version. Write it as a Conventional Commit: 'feat: run a client against a Group', 'fix(tui): ...', or 'feat!: ...' for a breaking change."
          exit 1

  # The installers are the one part of Perch that is not Rust, so nothing else
  # in this file would notice a mistake in them — and they are the copy people
  # pipe into a shell without reading. shellcheck and the PowerShell parser are
  # both already on the runners, so this costs a minute.
  installers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `-s sh` rather than bash: install.sh is piped into whatever `sh` is on
      # the machine, which on Debian is dash, and bashisms would work here and
      # fail there.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: |
          shellcheck --shell=sh packaging/pages/install.sh
          shellcheck --shell=sh packaging/pages/install-test.sh
          shellcheck --shell=sh packaging/homebrew/formula.sh

      # Runs the real install.sh against a fabricated release and asserts on
      # the PATH advice. The test builds its own PATH holding only the tools
      # the installer needs, which is how `gh` is kept off it: the provenance
      # check is binding by design and would refuse a fabricated archive.
      - name: install.sh advises correctly
        if: runner.os == 'Linux'
        run: sh packaging/pages/install-test.sh

      - name: PowerShell parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path packaging/pages/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }
          Write-Output "install.ps1 parses cleanly"

  # The one name branch protection listens to, however the matrix above grows
  # or renames its legs. `if: always()` with an explicit verdict, because a
  # plain `needs:` job is skipped when a leg fails — and a skipped required
  # check satisfies branch protection, which would wave the failure through.
  success:
    needs: [check, installers, title]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check concluded: ${{ needs.check.result }}"
            exit 1
          fi
          if [ "${{ needs.installers.result }}" != "success" ]; then
            echo "installers concluded: ${{ needs.installers.result }}"
            exit 1
          fi
          # `title` asks about a pull request title, so on a push to main there
          # is nothing for it to ask about and it skips. Skipped is a pass here
          # and only here — for `check` above it would be the failure this job
          # exists to catch.
          case "${{ needs.title.result }}" in
            success | skipped) ;;
            *)
              echo "title concluded: ${{ needs.title.result }}"
              exit 1
              ;;
          esac
