name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. CI only ever reads the repo, so nothing
# here can push, tag, comment, or publish even if a step is compromised.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS throughout: the keychain and the `security` binary are the point,
    # and the contract tests have to run somewhere they exist.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag is mutable and can be
      # repointed at new code by whoever owns the action. The trailing comment is
      # the tag the SHA stood for when it was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps GITHUB_TOKEN out of .git/config. Cargo runs build.rs from every
          # dependency during the build, so a hostile crate would otherwise have
          # a credential sitting on disk to read.
          persist-credentials: false

      # No toolchain action: rust-toolchain.toml pins the channel and its
      # components, so the version lives in one place rather than two that can
      # drift apart. rustup on the runner installs it on first use.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features so the contract suite is linted too: it is held back from
      # `cargo test` by a feature, and without this it would go unlinted.
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Everything the default feature set builds — lib, bin, doc tests, and
      # every tests/*.rs Cargo finds. Nothing to add here when a suite is: the
      # contract tests are the only ones held back, and they are held back by
      # `required-features` in Cargo.toml rather than by being absent from a
      # list somebody has to remember to extend.
      #
      # --locked because a resolver that is free to update Cargo.lock is a CI
      # run that tested a dependency set no one has committed.
      - name: Unit and behaviour tests
        run: cargo test --locked

      # Gives the contract tests a real bundle to assert against. If the install
      # is unavailable they assert the "no Claude Code here" branch instead, so
      # an outage upstream does not turn every pull request red.
      #
      # The installer is pinned by checksum but the version deliberately is not:
      # ADR 0007 wants the contract tests run against whatever Claude Code is
      # current, so pinning the version would freeze the drift this job exists
      # to detect. Pin the code that runs, float the product it installs.
      #
      # When this step fails on a checksum, Anthropic has almost certainly just
      # updated install.sh. Diff it, satisfy yourself, then bump INSTALL_SHA.
      - name: Install Claude Code
        env:
          INSTALL_SHA: cde4f1702d3b1695f92b73d26888364e17bca476e17f0fd676484c951d36c125
        run: |
          # An unreachable installer is an upstream outage, not a signal about
          # this pull request: degrade to the "no Claude Code" branch.
          if ! curl -fsSL https://claude.ai/install.sh -o /tmp/install.sh; then
            echo "::warning::installer unreachable; contract tests will assert the absent branch"
            exit 0
          fi

          # A checksum mismatch is not an outage. Fail hard rather than warn:
          # a warning here would let the install quietly stop happening, the
          # contract tests fall back to the absent branch, and CI stay green
          # with drift detection switched off.
          echo "$INSTALL_SHA  /tmp/install.sh" | shasum -a 256 -c -

          bash /tmp/install.sh latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Contract tests assert the probe's beliefs against the installed Claude
      # Code and the real keychain (ADR 0007), so drift is found here rather
      # than by a user being logged out by a background auto-update. Kept as a
      # step of its own so a failure here reads as upstream drift rather than as
      # a fault in the pull request.
      #
      # --nocapture so the "skipping:" lines are visible: a suite that skipped
      # itself and a suite that asserted look identical otherwise.
      - name: Contract tests
        run: cargo test --locked --features contract --test contract --test contract_credentials --test contract_sessions -- --nocapture
