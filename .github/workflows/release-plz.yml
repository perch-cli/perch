name: Release PR

# Every push to main, so the standing release pull request is always showing the
# version the merged commits add up to and the changelog they produce. Nothing
# is published by this workflow — merging that pull request is what tags, and
# the tag is what `release.yml` builds.
on:
  push:
    branches: [main]

# Nothing here uses GITHUB_TOKEN, so it gets nothing: GitHub refuses to start a
# workflow from a push its own token made (ADR this-repo-assembles-a-release).
# RELEASE_PLZ_TOKEN is a fine-grained token on this repository alone, with
# Contents: read and write for the branch and the tag, and Pull requests: read
# and write to open the release pull request.
permissions:
  contents: read

# Two pushes to main in quick succession would otherwise put two runs on the
# same release branch. Not cancel-in-progress: a half-finished tag is worse.
concurrency:
  group: release-plz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-plz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to a commit SHA, not a tag: a tag is mutable and can be
      # repointed at new code by whoever owns the action. The trailing comment
      # is the tag the SHA stood for when it was pinned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release-plz reads every commit back to the previous tag to decide
          # the bump and write the changelog. The default shallow clone has
          # none of them.
          fetch-depth: 0
          # release-plz is given the token on its command line, so it does not
          # need a credential in .git/config.
          persist-credentials: false

      # The binary rather than release-plz/action: this repository's Actions
      # policy admits neither it nor the three further actions it pulls in.
      # Pinned by version and by checksum, so bumping one without the other
      # fails here rather than running something nobody looked at.
      - name: release-plz
        env:
          RELEASE_PLZ_VERSION: 0.3.160
          RELEASE_PLZ_SHA: 47a7ced8ce2870b767f47232adbfd5c561784af7cd0dbe1a83456977fe786d4a
        run: |
          archive="$RUNNER_TEMP/release-plz.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/release-plz/release-plz/releases/download/release-plz-v${RELEASE_PLZ_VERSION}/release-plz-x86_64-unknown-linux-musl.tar.gz"
          echo "$RELEASE_PLZ_SHA  $archive" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" release-plz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # release-plz commits the version bump and the changelog, so git needs
      # somebody to attribute them to. The bot rather than a person: nobody wrote
      # these, and a human signature on them would be a small lie.
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: release-plz --version
        run: release-plz --version

      # Does nothing unless this push *was* the release pull request being
      # merged, in which case it tags what is there. First, so the step below
      # sees no unreleased commits rather than proposing the next Release.
      - name: Tag
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release --git-token "$TOKEN"

      # Opens, and on every later push updates, the standing release pull
      # request: its title is the version and its diff is the bump and the
      # changelog, so cutting a Release is reading it and clicking merge.
      - name: Release pull request
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          release-plz release-pr \
            --git-token "$TOKEN" \
            --repo-url "https://github.com/$GITHUB_REPOSITORY"
