name: Pages

# Builds and serves https://perch-cli.github.io/perch/ — the landing page, the
# installers, and the guide (ADR 0035).
#
# Two sources, one deployment. `packaging/pages/` is copied to the root, so the
# URL somebody pastes into a terminal does not carry a version and an installer
# that has to be released to be fixed does not stay broken until the next
# release. `docs/guide/` is rendered by mdBook into /guide/, from the same
# markdown GitHub shows — nothing is written twice.
#
# It deploys from main rather than from a release for the same reason it always
# did: everything here is fixed by a merge.
on:
  push:
    branches: [main]
    paths:
      - "packaging/pages/**"
      - "docs/guide/**"
      - "docs/book.toml"
      - "docs/theme/**"
      - ".github/workflows/pages.yml"
      - ".github/actions/mdbook/**"
  workflow_dispatch:

permissions:
  contents: read

# Pages has one live deployment, so two runs racing would have one of them
# quietly lose. Not cancel-in-progress: the loser should be the older one, and
# that is what queuing gives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: ./.github/actions/mdbook

      # The landing page and the installers, at the root. install-test.sh is
      # excluded: it runs against a fabricated release from a checkout, and is
      # no part of what anybody downloads.
      - name: Assemble the site
        run: |
          set -eu
          mkdir -p _site
          cp packaging/pages/index.html packaging/pages/install.sh packaging/pages/install.ps1 _site/

      # `--dest-dir` is resolved against the working directory rather than
      # against the book, so this is `_site/guide` at the root of the checkout.
      - name: Render the guide
        run: mdbook build docs --dest-dir _site/guide

      # What the deployment is for, asserted before it becomes the live one.
      - name: The installers are where they are pasted from
        run: |
          set -eu
          test -s _site/install.sh
          test -s _site/install.ps1
          test -s _site/index.html
          test -s _site/guide/index.html
          test -s _site/guide/reference.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
