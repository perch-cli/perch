name: Pages

# Serves the installers at https://mschieller.github.io/perch/. They live on
# main rather than in a release, deliberately: the URL somebody pastes into a
# terminal should not carry a version, and an installer that has to be released
# to be fixed is one that stays broken until the next release.
on:
  push:
    branches: [main]
    paths:
      - "packaging/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages has one live deployment, so two runs racing would have one of them
# quietly lose. Not cancel-in-progress: the loser should be the older one, and
# that is what queueing gives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packaging/pages

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
