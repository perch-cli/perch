name: Pages

# Builds and serves https://perch-cli.github.io/perch/ — the front page, the
# guide, and the installers (ADR 0062).
#
# One source now, where there used to be two. `pages/` is an Astro and Starlight
# project that renders the splash page and the guide together, and `pages/public/`
# is copied to the root of the output verbatim — so the URL somebody pastes into
# a terminal does not carry a version, and an installer that has to be released
# to be fixed does not stay broken until the next release.
#
# It deploys from main rather than from a release for the same reason it always
# did: everything here is fixed by a merge.
on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      # The logo is imported from where the app icons already live, rather than
      # copied into the site — so a change to it is a change to the site.
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages has one live deployment, so two runs racing would have one of them
# quietly lose. Not cancel-in-progress: the loser should be the older one, and
# that is what queuing gives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Node 24 and corepack, exactly as ci.yml does it: pnpm's version is
      # `packageManager` in pages/package.json, so the pull request that was
      # checked and the deployment that publishes are built by the same one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: pnpm
        run: corepack enable pnpm

      - name: Install
        working-directory: pages
        run: pnpm install --frozen-lockfile

      - name: Build the site
        working-directory: pages
        run: pnpm build

      # What the deployment is for, asserted before it becomes the live one. The
      # installers first, because they are the promise that predates the guide:
      # `public/` lands at the root, and nothing about how the pages are rendered
      # is allowed to move them.
      - name: The installers are where they are pasted from
        working-directory: pages
        run: |
          set -eu
          test -s dist/install.sh
          test -s dist/install.ps1
          test -s dist/index.html
          test -s dist/reference/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages/dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
