name: Pages

# Builds and serves https://perch-cli.github.io/perch/ — the front page, the
# guide, and the installers.
#
# The two halves keep different time, which is the whole shape of this file
# (ADR one-thing-renders-the-site): the guide comes from the newest release, the
# installers from `main`. So a run checks out the release, puts `main`'s
# `pages/public/` back on top, and deploys the release's site carrying the
# current installers. Every way in produces that same whole site — it is the
# assembly rather than the trigger that decides what goes out.
on:
  # Called by `release.yml` rather than triggered by the Release it creates:
  # GitHub will not start a workflow from an event GITHUB_TOKEN made, so a
  # `release: [published]` trigger here would look correct and never fire. Being
  # called also puts this after the artifacts are uploaded.
  workflow_call:
  # The installers, and nothing else. This file is deliberately not among the
  # paths: a change to how the two halves are assembled changes neither of them,
  # so the run would spend a live deployment republishing an identical artifact.
  push:
    branches: [main]
    paths:
      - "pages/public/**"
  workflow_dispatch:

permissions:
  contents: read

# Pages has one live deployment, so two runs racing would have one of them
# quietly lose. Not cancel-in-progress: the loser should be the older one, and
# that is what queuing gives.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The whole history, because this job resolves a tag and reads two refs out
      # of one clone. `ref: main` explicitly: a release event checks out the tag by
      # default, and the installers have to come from the branch either way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # The branch's tip, by hash, before anything moves the working tree off it.
      # A name would do until it did not: which local and remote-tracking refs the
      # checkout action leaves behind is its business rather than this file's, and
      # a hash cannot be pointed at something else by a later step.
      - name: Where main is
        id: main
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The newest release that *carries a site*, which is not always the newest
      # release. Where no tag does, the answer is `main` and this says so out loud
      # rather than failing — a rule, not a stopgap.
      - name: Which Perch the guide describes
        id: source
        run: |
          set -eu
          for tag in $(git tag --sort=-v:refname); do
            if git cat-file -e "$tag:pages/astro.config.ts" 2>/dev/null; then
              echo "ref=$tag" >> "$GITHUB_OUTPUT"
              echo "The guide is built from $tag, and the installers from main." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::notice::No release carries pages/ yet, so the guide is built from main. The next release fixes this on its own."
          echo "ref=main" >> "$GITHUB_OUTPUT"
          echo "No release carries a site yet, so the guide is built from main." >> "$GITHUB_STEP_SUMMARY"

      # The release's tree, entire — its guide, its splash page, its Astro
      # configuration, its lockfile. Taking `pages/` alone would leave the logo
      # `astro.config.ts` imports from `docs/assets/` coming from the branch, and a
      # site assembled from two commits is one no checkout can reproduce.
      - name: The release the guide describes
        run: git checkout --detach "${{ steps.source.outputs.ref }}"

      # And then the two files that are the exception, from the branch. These are
      # the only things `main` publishes, because these are the only things whose
      # URL somebody has already pasted into a terminal.
      - name: The installers, from main
        run: |
          set -eu
          git checkout ${{ steps.main.outputs.sha }} -- pages/public/install.sh pages/public/install.ps1
          git --no-pager diff --stat HEAD -- pages/public || true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Node 24 and corepack, exactly as ci.yml does it: pnpm's version is
      # `packageManager` in pages/package.json, so the pull request that was
      # checked and the deployment that publishes are built by the same one — the
      # release's one, here, which is the point.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: pnpm
        run: corepack enable pnpm

      - name: Install
        working-directory: pages
        run: pnpm install --frozen-lockfile

      - name: Build the site
        working-directory: pages
        run: pnpm build

      # The installers first, because they are the promise that predates the
      # guide. The last two say the guide was rendered at all, so a release whose
      # `pages/` is somehow empty fails here rather than replacing the live site
      # with two shell scripts.
      - name: The installers are where they are pasted from
        working-directory: pages
        run: |
          set -eu
          test -s dist/install.sh
          test -s dist/install.ps1
          test -s dist/index.html
          test -s dist/reference/index.html

      # And that the installers really are the branch's, which is the one thing
      # about this assembly that could go wrong silently: a checkout that failed to
      # overlay them would deploy the release's copies and look identical.
      - name: The installers really are main's
        run: |
          set -eu
          for installer in install.sh install.ps1; do
            git show "${{ steps.main.outputs.sha }}:pages/public/$installer" | diff - "pages/dist/$installer"
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages/dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
