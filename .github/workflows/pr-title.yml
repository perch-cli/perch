name: PR title

# A workflow of its own, because the event types are a property of the workflow
# rather than of the job. This one needs `edited`: a title is the one thing a
# check asks the author to change, and without it the verdict stays red on the
# old title. Asking `ci.yml` for it would rebuild a three-platform Rust matrix
# on every typo fixed in a description.
#
# `synchronize` is here despite a push never changing a title, because a required
# check is required *per commit*.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A title edited twice in a row does not need the first verdict.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # This repository squash-merges with the pull request title as the subject, so
  # the title *is* the commit release-plz reads to decide the next version
  # (ADR this-repo-assembles-a-release), and unchecked it fails as a wrong number
  # rather than as anything visible. Only the subject line carries the type, so
  # the `* feat: ...` bullets in the squash body are read as prose.
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conventional Commits
        # Through the environment rather than `${{ }}` inside the script: a title
        # is text a stranger chooses, and interpolating it into a shell runs
        # whatever a `$(...)` in it says, with this workflow's token.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "ok: $TITLE"
            exit 0
          fi
          echo "got: $TITLE"
          echo "::error::A pull request title is the commit message, and release-plz reads it to pick the version. Write it as a Conventional Commit: 'feat: run a client against a Group', 'fix(watcher): ...', or 'feat!: ...' for a breaking change."
          exit 1
