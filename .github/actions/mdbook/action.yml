name: mdbook
description: Puts the pinned mdBook on PATH, verified by hash.

# One pin, used twice: `ci.yml` builds the guide on every pull request and
# `pages.yml` builds the one that gets deployed. Two copies of a version number
# that have to agree is a number somebody eventually types wrong, and the way
# that fails is CI going green against a renderer the site does not use.
#
# Pinned by hash as well as by version, because a release tag can be moved and
# the bytes that render the docs are as much a supply chain as the ones that
# build them. Bump the two together: MDBOOK_SHA is `sha256sum` of the tarball
# the URL below resolves to.
#
# Linux only, which is every job that renders anything. A caller on another
# runner gets a clear failure rather than a mystery.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        MDBOOK_VERSION: v0.5.4
        MDBOOK_SHA: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "::error::the mdbook action is Linux-only, and this runner is $RUNNER_OS"
          exit 1
        fi
        dir="$RUNNER_TEMP/mdbook"
        mkdir -p "$dir"
        archive="mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL -o "$dir/$archive" \
          "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/$archive"
        echo "$MDBOOK_SHA  $dir/$archive" | sha256sum -c -
        tar xzf "$dir/$archive" -C "$dir" mdbook
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/mdbook" --version
