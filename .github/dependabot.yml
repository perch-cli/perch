# A prefix here becomes a commit subject, so it has to be one of Conventional
# Commits' types or `.github/workflows/pr-title.yml` refuses the pull request.
#
# `include: scope` is what adds the `(deps)`, and `(deps-dev)` for a development
# dependency, so the title says which kind it was without anyone writing it.
#
# Neither type bumps the version, which is the intent: a dependency update rides
# along with the next release rather than cutting one of its own. A bump that
# should reach people on its own is renamed to `fix(deps): …` by hand, and
# becomes a patch release.
version: 2

updates:
  # Actions are pinned to commit SHAs, which means they no longer pick up
  # upstream fixes on their own. Dependabot is what keeps the pins current: it
  # opens a PR moving the SHA and rewrites the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    labels:
      - ready-for-human

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # `build` rather than `deps`: Conventional Commits reserves this type for
      # changes to the build system and external dependencies, which is exactly
      # what a crate bump is. `deps` reads better and is not in the vocabulary.
      prefix: build
      include: scope
    labels:
      - ready-for-human
    # One PR per batch rather than per crate: the lockfile is the unit that
    # actually gets reviewed, and a dozen open PRs trains you to rubber-stamp.
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # The site (ADR one-thing-renders-the-site). `npm` is the ecosystem that
  # covers pnpm — there is no `pnpm` to write here — and `/pages` is the only
  # directory in this repository that is a JavaScript project.
  - package-ecosystem: npm
    directory: /pages
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    labels:
      - ready-for-human
    groups:
      site-minor-patch:
        update-types:
          - minor
          - patch
