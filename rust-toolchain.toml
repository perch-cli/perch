[toolchain]
# Pinned so everyone — and CI — builds Perch with the toolchain it was written
# against, rather than whatever `stable` happens to be that week.
channel = "1.97.1"
components = ["rustfmt", "clippy"]

# No `targets`: listing them makes every contributor download five standard
# libraries to build for the one they are sitting in front of. A release names
# the one cross-compile it needs, in the workflow that needs it.
