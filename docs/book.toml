# The guide, rendered (ADR 0035). `docs/guide/` is the source and is read as
# markdown on GitHub too; this only decides how it looks in a browser. mdBook is
# given `guide` as its source directory rather than a copy of it, so there is no
# step in which the two could differ.
#
# `--dest-dir` is resolved against the working directory rather than against this
# file, so from the root of a checkout:
#
#   mdbook build docs --dest-dir _site/guide
#
# The landing page and the installers are not mdBook's. They are static files in
# `packaging/pages/`, deployed to the root of the site, because the URL somebody
# pastes into a terminal must not move.

[book]
title = "Perch"
description = "Run Claude Code as whichever Claude account you want, without going through the login flow again."
authors = ["The Perch authors"]
language = "en"
src = "guide"

[build]
# A link mdBook cannot resolve is a 404 on the deployed site, and the deploy is
# the last place to find one.
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/perch-cli/perch"
# `{path}` arrives relative to this file, so it already carries `guide/`.
edit-url-template = "https://github.com/perch-cli/perch/edit/main/docs/{path}"
# The book is served under /perch/guide/, not at a domain root. Only the 404 page
# needs to know — everything else mdBook emits is relative.
site-url = "/perch/guide/"
additional-css = ["theme/perch.css"]

[output.html.fold]
enable = false
