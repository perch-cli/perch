[workspace]
# release-plz decides what version and why; `release.yml` owns every file a
# Release is made of (ADR this-repo-assembles-a-release), and cannot upload one
# until it has built it.
git_release_enable = false

# So the tag is release-plz's last act, and the only thing it hands over. It is
# pushed with RELEASE_PLZ_TOKEN rather than GITHUB_TOKEN — see release-plz.yml.
git_tag_enable = true
git_tag_name = "v{{ version }}"

# What keeps Perch off crates.io, and it has to live here rather than in
# Cargo.toml: release-plz reads that field in a manifest as "not one of mine" and
# skips the package outright, silently.
publish = false

# The half `publish = false` does not make. Left to ask, release-plz looks up the
# last released version of the unrelated `perch` crate; `git_only` says the
# previous version is the newest tag, which is the only place it was recorded.
git_only = true

# The `[lib]` exists so the binary and the tests can share code, and promises no
# public API.
semver_check = false

# A Release contains the commits that were reviewed and nothing else. A
# dependency bump arriving in the release pull request is a change to the built
# artifact at the moment nobody is reading for one.
dependencies_update = false
