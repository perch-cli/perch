[package]
name = "perch"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Run Claude Code as whichever Claude account you want, without logging in again"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

# Both already in the build transitively; declaring them adds no crate and buys
# vetted declarations for the primitives std does not carry (ADR 0021).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# The contract suite needs a real Claude Code installed and a real keychain to
# assert against, so it is off unless asked for and `cargo test` runs everything
# else. CI turns it on for the one step that follows the install.
contract = []

# Declared only so they can be held back by the feature above. Every other test
# binary is found automatically, which is the point: the list that has to be
# maintained by hand is the short one of deliberate exclusions, not the growing
# one of suites that must be remembered.
[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "contract_credentials"
required-features = ["contract"]

[[test]]
name = "contract_sessions"
required-features = ["contract"]

[lib]
name = "perch"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"
