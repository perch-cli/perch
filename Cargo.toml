[package]
name = "perch"
version = "0.1.0"
edition = "2024"
# The minimum this builds with, as convention writes one: the patch belongs in
# rust-toolchain.toml, which is where the exact toolchain is already pinned.
rust-version = "1.97"
description = "Run Claude Code as whichever Claude account you want, without logging in again"

# The pair the Rust ecosystem uses, and for the reason it uses it: MIT carries
# no patent language at all, and Apache-2.0 — which does — cannot be combined
# with GPLv2. Offering both lets whoever is downstream take the one that solves
# their problem, and costs the project nothing but a second file.
license = "MIT OR Apache-2.0"

# crates.io is not one of Perch's channels: `perch` there is a live Mastodon
# client, and Perch is an application rather than a library, so nothing depends
# on it as a crate. This is what stops `cargo publish` — and release-plz, which
# would otherwise run it — from trying anyway.
publish = false

# Local `cargo clippy` and CI agree, rather than CI being the only place that
# says no. `unsafe_op_in_unsafe_fn` because there are five `unsafe` blocks in
# host/real.rs and every one of them should have to be written as such.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"

# A distributed CLI is a binary somebody downloads, so its size is a cost they
# pay. None of this changes behaviour.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[dependencies]
# What `perch export` writes (ADR 0014). Encryption sits on neither of Perch's
# seams — it is not an effect the Host port carries, and it is not shared with
# Claude Code — so a crate costs nothing here (ADR 0025). The property that
# decided it is that an `age` file is read by the standard `age` command: a
# backup meant to outlive the machine should not depend on Perch still existing.
# `armor` is `age`'s text encoding of the same file, which is what lets the
# Export go through the Host port's ordinary private write.
age = { version = "0.12.1", default-features = false, features = ["armor"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }

# The terminal `perch tui` draws in (ADR 0016). Named directly rather than left
# to `ratatui-crossterm`, and pinned to the version that resolves to, so there
# is one crossterm in the tree: raw mode is process-global state, and two of
# them would each think they owned it.
crossterm = "0.29"

# What draws the frames (ADR 0016). Its default features carry widgets Perch
# does not use — a calendar among them — so it is taken as the backend and the
# core alone, which is what a binary somebody downloads pays for.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "std",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

# How wide a string is drawn, for the two surfaces that lay out the same
# listing in columns. Already in the build transitively — ratatui measures every
# frame with it — so declaring it adds no crate, and it sits on no seam (ADR
# 0025): it is a pure function of a string. A hand-rolled table of East Asian
# widths would be the same data, kept by hand, going wrong quietly.
unicode-width = "0.2.2"

# Both already in the build transitively — libc through sha2's cpufeatures,
# windows-sys through clap's anstream — so declaring them adds no crate and buys
# vetted declarations for the primitives std does not carry (ADR 0021).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A directory junction is how Shared State reaches a Run's Profile on a Windows
# without Developer Mode (ADR 0026), and it is a reparse point the standard
# library will not write. The alternative was a hand-built REPARSE_DATA_BUFFER
# through DeviceIoControl — precisely the class of `unsafe` ADR 0021 declined to
# write — and this sits behind the Host port either way, which is where a crate
# costs no seam (ADR 0025). Windows-only, and it carries no dependencies.
junction = { version = "2", default-features = false }

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# The contract suite needs a real Claude Code installed and a real keychain to
# assert against, so it is off unless asked for and `cargo test` runs everything
# else. CI turns it on for the one step that follows the install.
contract = []

# The two fakes — `host::fake` and `tui::fake` — which exist so the real command
# code and the real frame loop can be driven with no machine and no terminal.
# Behaviour tests are integration tests, so they link the library as any other
# crate would and `#[cfg(test)]` cannot reach them; without a feature the fakes
# went into the binary somebody downloads, along with every scripted keystroke,
# planted keychain item and injected failure they carry.
#
# Turned on by the dev-dependency below, which is this package on itself: the
# documented way to say "the tests need more of the library than the binary
# does". `cargo test` gets it without being asked, `cargo build` does not.
fakes = []

[dev-dependencies]
perch = { path = ".", features = ["fakes"] }

# Declared only so they can be held back by the feature above. Every other test
# binary is found automatically, which is the point: the list that has to be
# maintained by hand is the short one of deliberate exclusions, not the growing
# one of suites that must be remembered.
[[test]]
name = "contract"
required-features = ["contract"]

[[test]]
name = "contract_credentials"
required-features = ["contract"]

[[test]]
name = "contract_sessions"
required-features = ["contract"]

[[test]]
name = "contract_links"
required-features = ["contract"]

[lib]
name = "perch"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"
