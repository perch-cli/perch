[package]
name = "perch"
version = "0.2.0"
edition = "2024"
# The minimum this builds with, as convention writes one: the patch belongs in
# rust-toolchain.toml, which is where the exact toolchain is already pinned.
rust-version = "1.97"
description = "Run Claude Code as whichever Claude account you want, without logging in again"

# The pair the Rust ecosystem uses, and for the reason it uses it: MIT carries
# no patent language at all, and Apache-2.0 — which does — cannot be combined
# with GPLv2. Offering both lets whoever is downstream take the one that solves
# their problem, and costs the project nothing but a second file.
license = "MIT OR Apache-2.0"

# crates.io is not one of Perch's channels (ADR this-repo-assembles-a-release),
# but that is settled in release-plz.toml rather than here. `publish = false` in
# this file does not mean "do not publish this package" to release-plz — it
# means "this package is not mine", and release-plz skips it silently: no
# version, no changelog, no release pull request, no error. See the comment on
# `publish` there.

# Local `cargo clippy` and CI agree, rather than CI being the only place that
# says no. `unsafe_op_in_unsafe_fn` because host/real.rs carries every platform
# primitive ADR a-crate-must-not-cost-a-seam chose to link rather than shell out
# to — process liveness, file times, terminal echo, signal handlers — and every
# one of those operations should have to be written as `unsafe` rather than
# inherited from the signature around it. The count is deliberately not written
# down here: it moves, and a number in a comment that moves is a comment that is
# wrong.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"

# A distributed CLI is a binary somebody downloads, so its size is a cost they
# pay. None of this changes behavior.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# scrypt is deliberately expensive, and `export.rs` pins how expensive. An
# unoptimized build of it is that cost times twenty — which is paid by nothing a
# user runs, and by every test that seals or opens an Export, several times each.
# Optimizing the three crates that do the arithmetic takes the suite back from
# minutes to seconds without touching the work factor, which is the number that
# is supposed to decide this.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[dependencies]
# What `perch holdings export` writes (ADR the-holdings-go-out-sealed).
# Encryption sits on neither of Perch's seams — it is not an effect the Host
# port carries, and it is not shared with Claude Code — so a crate costs nothing
# here (ADR a-crate-must-not-cost-a-seam). The property that decided it is that
# an `age` file is read by the standard `age` command: a backup meant to outlive
# the machine should not depend on Perch still existing. `armor` is `age`'s text
# encoding of the same file, which is what lets the Export go through the Host
# port's ordinary private write.
age = { version = "0.12.1", default-features = false, features = ["armor"] }
chrono = { version = "0.4", features = ["serde"] }

# Wipes a buffer before it is freed, for the two that hold every Credential on
# the machine at once: the passphrase an Export is sealed with, and the
# serialized bundle either side of the encryption. Freed heap outlives the
# process in a core dump, a swap file or a hibernation image, and a compiler is
# entitled to elide a plain overwrite of memory nothing reads again — which is
# the whole of what this crate is and why it cannot be hand-rolled.
#
# It sits on neither of Perch's seams (ADR a-crate-must-not-cost-a-seam) and is
# already in the tree through `age`, so it adds no crate to the build and
# nothing to audit that was not being audited already.
zeroize = "1.9"
clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

# How wide a string is drawn, for the listing that lays itself out in columns.
# A crate of its own now that ratatui is gone, and it survives
# ADR a-crate-must-not-cost-a-seam's actual test rather than the free-rider one:
# the width of a string is a pure function and sits on no seam. A hand-rolled
# table of East Asian widths would be the same data, kept by hand, going wrong
# quietly — and `perch list` has grown a column since, so it needs the measuring
# more rather than less.
unicode-width = "0.2.2"

# Both already in the build transitively — libc through sha2's cpufeatures,
# windows-sys through clap's anstream — so declaring them adds no crate and buys
# vetted declarations for the primitives std does not carry
# (ADR a-crate-must-not-cost-a-seam).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A directory junction is how Shared State reaches a Run's Profile on a Windows
# without Developer Mode (ADR everything-but-the-account), and it is a reparse
# point the standard library will not write. The alternative was a hand-built
# REPARSE_DATA_BUFFER through DeviceIoControl — precisely the class of `unsafe`
# ADR a-crate-must-not-cost-a-seam declined to write — and this sits behind the
# Host port either way, which is where a crate costs no seam
# (ADR a-crate-must-not-cost-a-seam). Windows-only, and it carries no
# dependencies.
junction = { version = "2", default-features = false }

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# A test behind this one touches state the developer owns and did not offer —
# their login keychain, their `~/.claude`, the clients they happen to have open
# — so its outcome is not this repository's to determine
# (ADR an-assumption-is-probed). A read of their real state counts as much as a
# write: a suite that reports green on Tuesday and skipped on Wednesday, on the
# same machine at the same commit, according to whether a client was running, is
# the one thing a default-on suite must never be. Off unless asked for; CI turns
# it on for the one step that follows the install.
your-machine = []

# `host::fake`, which exists so the real command code can be driven with no
# machine.
# Behavior tests are integration tests, so they link the library as any other
# crate would and `#[cfg(test)]` cannot reach them; without a feature the fake
# went into the binary somebody downloads, along with every planted keychain
# item and injected failure it carries.
#
# Turned on by the dev-dependency below, which is this package on itself: the
# documented way to say "the tests need more of the library than the binary
# does". `cargo test` gets it without being asked, `cargo build` does not.
fakes = []

[dev-dependencies]
perch = { path = ".", features = ["fakes"] }

# Declared only so it can be held back by the feature above. Every other test
# binary is found automatically, which is the point: the list that has to be
# maintained by hand is the short one of deliberate exclusions, not the growing
# one of suites that must be remembered.
[[test]]
name = "your_machine"
required-features = ["your-machine"]

[lib]
name = "perch"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"
