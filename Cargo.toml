[package]
name = "perch"
version = "0.3.3"
edition = "2024"
# The minimum this builds with, as convention writes one: the patch belongs in
# rust-toolchain.toml, which is where the exact toolchain is already pinned.
rust-version = "1.97"
description = "Run Claude Code as whichever Claude account you want, without logging in again"

# The pair the Rust ecosystem uses, and for the reason it uses it: MIT carries
# no patent language at all, and Apache-2.0 — which does — cannot be combined
# with GPLv2. Offering both lets whoever is downstream take the one that solves
# their problem, and costs the project nothing but a second file.
license = "MIT OR Apache-2.0"

# No `publish = false` here: release-plz reads it as "this package is not mine"
# and skips the package silently. crates.io is not one of Perch's Channels
# (ADR this-repo-assembles-a-release), and release-plz.toml is where that is set.

# Local `cargo clippy` and CI agree, rather than CI being the only place that
# says no. `unsafe_op_in_unsafe_fn` because host/real.rs carries the platform
# primitives Perch links rather than shells out to, and each one should have to
# be written as `unsafe` rather than inherited from the signature around it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"

# A distributed CLI is a binary somebody downloads, so its size is a cost they
# pay. None of this changes behavior.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# scrypt is deliberately expensive, and `export.rs` pins how expensive. An
# unoptimized build of it is that cost times twenty, paid by nothing a user runs
# and by every test that seals or opens an Export. Optimizing the three crates
# that do the arithmetic leaves the work factor alone, which is the number that
# is supposed to decide this.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# A crate is taken unless it would sit on the wrong side of a seam — the Host
# port, or fidelity to what Claude Code actually does
# (ADR a-crate-must-not-cost-a-seam). Every entry below says which side it is on.
[dependencies]
# What `perch holdings export` writes (ADR the-holdings-go-out-sealed), and it
# sits on neither seam. An `age` file is read by the standard `age` command, so
# a backup meant to outlive the machine does not depend on Perch still existing.
# `armor` is the same file text-encoded, which is what lets the Export go
# through the Host port's ordinary private write.
age = { version = "0.12.1", default-features = false, features = ["armor"] }
chrono = { version = "0.4", features = ["serde"] }

# Wipes a buffer before it is freed: the passphrase an Export is sealed with,
# and the serialized bundle either side of the encryption. Freed heap outlives
# the process in a core dump or a hibernation image, and a compiler may elide a
# plain overwrite of memory nothing reads again. On neither seam, and already in
# the tree through `age`, so it adds no crate and nothing new to audit.
zeroize = "1.9"
clap = { version = "4", features = ["derive"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

# Whether a character may open an identifier or continue one, which is the rule
# a Group name and an Alias are held to (ADR a-target-has-to-be-typeable). On
# neither seam: `XID_Start` and `XID_Continue` are Unicode's own properties, and
# a table of them kept by hand is the same data going wrong quietly. Already
# compiled on every build through `clap_derive`, and it depends on nothing.
unicode-ident = "1.0.24"

# How wide a string is drawn, for the listing that lays itself out in columns.
# It survives the actual test rather than the free-rider one: the width of a
# string is a pure function and sits on no seam. A hand-rolled table of East
# Asian widths would be the same data, kept by hand, going wrong quietly.
unicode-width = "0.2.2"

# Both already in the build transitively — libc through sha2's cpufeatures,
# windows-sys through clap's anstream — so declaring them adds no crate and buys
# vetted declarations for the primitives std does not carry.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A directory junction is how Shared State reaches a Run's Profile on a Windows
# without Developer Mode (ADR everything-but-the-account), and a reparse point
# the standard library will not write. The alternative is a hand-built
# REPARSE_DATA_BUFFER through DeviceIoControl, and the call sits inside RealHost
# either way, so it costs no seam. Windows-only, and it depends on nothing.
junction = { version = "2", default-features = false }

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# The gate for the suite that touches state the developer owns and did not
# offer (ADR a-suite-is-named-and-gated). Off unless asked for; CI turns it on
# for the one step that follows the install.
your-machine = []

# `host::fake`, so the real command code can be driven with no machine. Behavior
# tests are integration tests, so they link the library as any other crate would
# and `#[cfg(test)]` cannot reach them; without this feature the fake ships in
# the binary somebody downloads. Turned on by the dev-dependency below, which is
# this package on itself: `cargo test` gets it, `cargo build` does not.
fakes = []

[dev-dependencies]
perch = { path = ".", features = ["fakes"] }

# Declared only so it can be held back by the feature above. Every other test
# binary is found automatically, which is the point: the list that has to be
# maintained by hand is the short one of deliberate exclusions, not the growing
# one of suites that must be remembered.
[[test]]
name = "your_machine"
required-features = ["your-machine"]

[lib]
name = "perch"
path = "src/lib.rs"

[[bin]]
name = "perch"
path = "src/main.rs"
